name: Ticketing lab

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/ticketing-lab.yml"
      - "labs/aws/01-cloud-architecture-ticketing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-correctness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install code-quality tooling
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: |
          python -m pip install --requirement requirements-app.txt
          python -m pip install --requirement requirements-test.txt

      - name: Check Python
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: |
          ruff check app scripts tests
          ruff format --check app scripts tests

      - name: Run invariant tests
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: python -m unittest discover -s tests -v

      - name: Validate Compose model
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: docker compose config --quiet

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and start local stack
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: docker compose up --build --detach

      - name: Wait for API readiness
        run: |
          curl --fail --retry 30 --retry-all-errors --retry-delay 2 \
            http://localhost:8080/ready

      - name: Run end-to-end smoke test
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: python scripts/smoke.py

      - name: Show diagnostics on failure
        if: failure()
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: docker compose logs --no-color

      - name: Tear down local stack
        if: always()
        working-directory: labs/aws/01-cloud-architecture-ticketing
        run: docker compose down --volumes --remove-orphans
